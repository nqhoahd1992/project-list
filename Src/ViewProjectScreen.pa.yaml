Screens:
  ViewProjectScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(gShowRateInfo, false);
        Set(gHasPendingCR,
            !IsBlank(
                LookUp(Project_ChangeRequests,
                    TargetItemID = gSelectedProject.ID &&
                    (ApprovalStatus.Value = "Pending Manager Approval" || ApprovalStatus.Value = "Pending Sponsor Approval")
                )
            )
        );
        ClearCollect(colChildProjects,
            Sort(
                Filter(Project_List,
                    ProjectLevel = 1 &&
                    Not(IsBlank(gSelectedProject.ProjectID)) &&
                    RootProjectID = gSelectedProject.ProjectID
                ),
                ProjectID,
                SortOrder.Ascending
            )
        );
        ClearCollect(colProjectInvoices,
            Filter(Procurement_InvoiceData,
                Not(IsBlank(gSelectedProject.ProjectID)) &&
                ProjectID = gSelectedProject.ProjectID
            )
        );
        ForAll(colChildProjects As childProject,
            Collect(colProjectInvoices,
                Filter(Procurement_InvoiceData, ProjectID = childProject.ProjectID)
            )
        )
    Children:
      - rectHeader_5:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblScreenTitle_4:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: ="Max Biocare Project List - Project Details"
            Width: =719
            X: =20
      - lblUserInfo_5:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            Height: =60
            Size: =12
            Text: |-
              =If(
                  IsBlank(gCurrentUser.Role.Value),
                  gCurrentEmployee.Title,
                  gCurrentEmployee.Title & " | " & gCurrentUser.Role.Value
              )
            Width: =280
            X: =Parent.Width - 300
      - containerScroll_3:
